version: "3.3"

services:
  telegram-forwarder:
    build:
      context: .
      args:
        APP_UID: ${APP_UID}
        APP_GID: ${APP_GID}
    container_name: telegram-forwarder
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config/groups.yaml:/app/config/groups.yaml:ro
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - ai-internal

networks:
  ai-internal:
    external: true
